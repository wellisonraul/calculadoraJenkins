groups:
 - name: Count greater than 5
   rules:
   - alert: CountGreaterThan5
     expr: ping_request_count > 5
     for: 10s
     labels:
       severity: critical
       team: devops
       service: go-lang-web
     annotations:
       summary: "Alta contagem de requisições de ping"
       description: "O número de requisições de ping ultrapassou 5 nos últimos 10 segundos. Valor atual: {{ $value }}"
       dashboard: "https://grafana.example.com/d/ping-monitor"
       runbook: "https://wiki.example.com/ping-alerts"
